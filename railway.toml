# Dockerfile: Node Ops only. Chrome Ext TCS/SCSC trên PC thực thi eSID/eCargo.
# Không Playwright/Python. Gỡ TCS_AGENT_* + volume browser_profile là ops follow-up.
# Docs: docs/railway-online-portal.md
#
# Build: Dockerfile · start: node scripts/start-fullstack.mjs

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
