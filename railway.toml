# Dockerfile: Node + Playwright headless — portal online, không máy kho.
# Ops → /tcs-agent → :8765 (TECS-TCS) + :8766 (TCS).
# Variables: TCS_USERNAME(_TCS) / TCS_PASSWORD(_TCS). Docs: docs/railway-online-portal.md
# Region: asia-southeast1. Mount volume browser_profile_hub + browser_profile_tcs.
#
# Build: Dockerfile · start: node scripts/start-fullstack.mjs

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
