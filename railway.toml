# Dockerfile: Node + agent Playwright. API-first (headless).
# Phone: Quét/PDF qua /tcs-agent (header X-Portal-Warehouse); CSD trên Ops.
# Dual agent: TCS_AGENT_DUAL=1 + credential kho TCS.
# Region khuyến nghị: asia-southeast1. Volume giữ browser_profile_*.
#
# Build: Docker build từ Dockerfile.
# start: node scripts/start-fullstack.mjs

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
