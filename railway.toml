# Dockerfile: Node + Playwright — portal online, không máy kho.
# Mặc định TCS_AUTO_OPEN=0, TCS_AGENT_DUAL=0: không mở Chromium lúc boot.
# Chrome on-demand khi Đăng Nhập TCS / Quét. Dual :8766 chỉ khi TCS_AGENT_DUAL=1.
# Variables: TCS_USERNAME(_TCS) / TCS_PASSWORD(_TCS). Docs: docs/railway-online-portal.md
# Region: asia-southeast1. Mount volume browser_profile_hub + browser_profile_tcs.
#
# Build: Dockerfile · start: node scripts/start-fullstack.mjs

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
