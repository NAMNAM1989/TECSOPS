# Dockerfile: Node + agent Playwright. API-first (headless).
# Ops → /tcs-agent. Điền trực quan = Chrome Ext trên máy user.
# Không còn noVNC / TCS_VNC.
#
# Build: Docker build từ Dockerfile (Railway dùng builder dockerfile).
# startCommand: node scripts/start-fullstack.mjs
# start-fullstack: agent headless mặc định (TCS_HEADLESS=1).
# Volume TCS_BROWSER_PROFILE giữ session.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
